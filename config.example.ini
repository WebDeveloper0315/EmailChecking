; Copy to config.ini and edit, or use the "Account…" button in the viewer.
; Environment variables win over this file:
;   MAIL_USERNAME, MAIL_PASSWORD, IMAP_SERVER, IMAP_PORT, MAIL_DOWNLOAD_DIR

[account]
host = imap.gmail.com
port = 993
username = you@gmail.com
; Gmail/Outlook need an APP PASSWORD, not your normal password.
; Leave empty to be asked at start-up (recommended: this file is plain text).
password =
use_ssl = True
starttls = False
folder = INBOX

[viewer]
download_dir = downloads
fetch_limit = 50
; unread, today, all, or a sender address
default_filter = unread
; Marking as read changes the mailbox on the server - off by default.
mark_seen = False
remember_password = False
; Remote images track when you open a message - off by default.
allow_remote_images = False
